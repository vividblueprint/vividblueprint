name: Profile Cards

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate Profile Cards
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: vividblueprint
          cards: overview,lifetime #,momentum,contributions,composition,rhythm,cadence,repositories,portfolio,languages
          output-dir: assets
          themes: light,dark
          commit: true